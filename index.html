<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FX-991ES Plus Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<div class="calculator">

    <!-- TOP -->
    <div class="calculator-top">

        <div class="brand">
            <h1>CASIO</h1>
            <span>fx-991ES PLUS</span>
        </div>

        <div class="solar-panel">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>

    </div>


    <!-- DISPLAY -->
    <div class="display-container">

        <div class="display-status">
            <span id="modeIndicator">COMP</span>
            <span id="angleIndicator">DEG</span>
            <span id="shiftIndicator"></span>
        </div>

        <div id="history"></div>

        <input
            type="text"
            id="screen"
            value="0"
            readonly
        >

    </div>


    <!-- MODE BUTTONS -->
    <div class="mode-buttons">

        <button class="function yellow" onclick="toggleShift()">
            SHIFT
        </button>

        <button class="function red" onclick="toggleAlpha()">
            ALPHA
        </button>

        <button class="function" onclick="deleteLast()">
            DEL
        </button>

        <button class="function" onclick="clearScreen()">
            AC
        </button>

    </div>


    <!-- SCIENTIFIC BUTTONS -->
    <div class="scientific-buttons">

        <button onclick="square()">x²</button>

        <button onclick="cube()">x³</button>

        <button onclick="reciprocal()">1/x</button>

        <button onclick="squareRoot()">√</button>

        <button onclick="cubeRoot()">∛</button>

        <button onclick="factorial()">x!</button>

        <button onclick="percentage()">%</button>

        <button onclick="absolute()">|x|</button>

    </div>


    <!-- TRIG -->
    <div class="scientific-buttons">

        <button onclick="trig('sin')">
            sin
        </button>

        <button onclick="trig('cos')">
            cos
        </button>

        <button onclick="trig('tan')">
            tan
        </button>

        <button onclick="inverseTrig('sin')">
            sin⁻¹
        </button>

        <button onclick="inverseTrig('cos')">
            cos⁻¹
        </button>

        <button onclick="inverseTrig('tan')">
            tan⁻¹
        </button>

        <button onclick="logFunction()">
            log
        </button>

        <button onclick="lnFunction()">
            ln
        </button>

    </div>


    <!-- MAIN KEYPAD -->
    <div class="buttons">

        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>
        <button onclick="press('^')">xʸ</button>
        <button onclick="press('/')">÷</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('*')">×</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('-')">−</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('+')">+</button>

        <button onclick="press('0')" class="zero">
            0
        </button>

        <button onclick="press('.')">
            .
        </button>

        <button onclick="insertPi()">
            π
        </button>

        <button onclick="insertE()">
            e
        </button>

        <button onclick="calculate()" class="equal">
            =
        </button>

    </div>


    <!-- EXTRA FUNCTIONS -->
    <div class="extra-buttons">

        <button onclick="toggleAngle()">
            DEG/RAD
        </button>

        <button onclick="useAnswer()">
            ANS
        </button>

        <button onclick="showHistory()">
            HISTORY
        </button>

        <button onclick="clearHistory()">
            CLR HIST
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
